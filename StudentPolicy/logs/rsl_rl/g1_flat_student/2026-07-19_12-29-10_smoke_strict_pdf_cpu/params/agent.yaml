seed: 42
device: cpu
num_steps_per_env: 24
max_iterations: 1
empirical_normalization: true
obs_groups: {}
clip_actions: null
save_interval: 500
experiment_name: g1_flat_student
run_name: smoke_strict_pdf_cpu
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
policy:
  class_name: ActorCritic
  init_noise_std: 0.01
  noise_std_type: scalar
  state_dependent_std: false
  actor_obs_normalization: {}
  critic_obs_normalization: {}
  actor_hidden_dims:
  - 2048
  - 1024
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  depth_height: 58
  depth_width: 87
  depth_dim: 32
algorithm:
  class_name: PPO
  num_learning_epochs: 2
  num_mini_batches: 96
  learning_rate: 0.0003
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.001
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg: null
teacher_checkpoint: ../new_teacherpolicy/logs/rsl_rl/g1_flat/2026-07-19_09-25-21/model_1000.pt
dagger_loss_coef: 10.0
dagger_curriculum_iterations: 10000
expert_anchor_pos_threshold: 0.5
expert_anchor_ori_threshold: 0.8
expert_ee_pos_threshold: 0.8
enable_kl_after_iteration: 1000
